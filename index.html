<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FairShare</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FairShare">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--sep:#38383a;--text:#fff;--muted:#8e8e93;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--p1:#0a84ff;--p2:#bf5af2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:max(env(safe-area-inset-top),16px) 0 calc(96px + env(safe-area-inset-bottom))}
::-webkit-scrollbar{display:none}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 2px 18px}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:0}
.sub{color:var(--muted);font-size:14px}
.small{font-size:12px;color:var(--muted);line-height:1.45}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-size:42px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px}
.mid{font-size:22px;font-weight:700;letter-spacing:-.3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 10px;font:600 16px -apple-system,system-ui,sans-serif;color:#fff;background:var(--blue);cursor:pointer}
.btn:active,.link:active,.tap:active{opacity:.6}
.btn.gray{background:var(--card2)}
.btn.go{background:var(--green);color:#000}
.btn.del{background:var(--card2);color:var(--red)}
.btn.del.armed{background:var(--red);color:#fff}
.btn.sm{padding:10px;font-size:14px;border-radius:12px}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.mt{margin-top:14px}
.list{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--sep)}
.item:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.t{font-weight:500;overflow-wrap:anywhere}
.s{font-size:12px;color:var(--muted);margin-top:2px}
.amt{font-weight:600;text-align:right;white-space:nowrap}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.section{display:flex;justify-content:space-between;align-items:center;margin:24px 4px 8px}
.section h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--blue);font:500 15px -apple-system,system-ui,sans-serif;padding:4px;cursor:pointer}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--card2);margin:14px 0 10px}
.bar div{height:100%}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:15px}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600}
.hr{height:.5px;background:var(--sep);margin:8px 0}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:rgba(48,209,88,.15);color:var(--green)}
.pill.due{background:rgba(255,159,10,.15);color:var(--orange)}
.pill.exp{background:rgba(142,142,147,.18);color:var(--muted)}
.c-green{color:var(--green)}.c-red{color:var(--red)}.c-orange{color:var(--orange)}.c-muted{color:var(--muted)}.c-blue{color:var(--blue)}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.monthnav button{background:var(--card);border:0;color:var(--blue);width:40px;height:40px;border-radius:20px;font-size:20px;cursor:pointer}
.progress{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:var(--green)}
.route{display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:12px 14px;border-radius:12px;margin-top:8px}
.route.save{background:rgba(48,209,88,.12);color:var(--green)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;background:rgba(28,28,30,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:7px 4px max(env(safe-area-inset-bottom),8px)}
.tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10px -apple-system,system-ui,sans-serif;width:64px;cursor:pointer}
.tabs button.on{color:var(--blue)}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:21px;letter-spacing:-.3px}
.x{background:var(--card2);color:var(--muted);border:0;width:32px;height:32px;border-radius:16px;font-size:18px;cursor:pointer}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px 4px}
input,select,textarea{width:100%;background:var(--card2);color:#fff;border:0;border-radius:12px;padding:14px;font:17px -apple-system,system-ui,sans-serif;color-scheme:dark;outline:none;-webkit-appearance:none;appearance:none}
input.money{font-size:26px;font-weight:700}
textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:#fff;padding:10px 4px;border-radius:9px;font:500 14px -apple-system,system-ui,sans-serif;cursor:pointer}
.seg button.on{background:#636366}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:12px;padding:12px 14px;gap:12px}
.toggle input{width:22px;height:22px;-webkit-appearance:auto;appearance:auto;accent-color:var(--blue);flex:none}
input[type=range]{padding:0;height:30px;background:none;-webkit-appearance:auto;appearance:auto;accent-color:var(--blue)}
.toast{position:fixed;left:50%;top:max(env(safe-area-inset-top),14px);transform:translateX(-50%);background:#3a3a3c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.who{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--blue)}
.alert.warn{border-left-color:var(--orange)}.alert.bad{border-left-color:var(--red)}.alert.good{border-left-color:var(--green)}
.alert .ic{font-size:18px;line-height:1.2;flex:none}
.alert .msg{flex:1;font-size:14px;line-height:1.4}
.alert .msg b{font-weight:600}
.alert .acts{display:flex;gap:8px;margin-top:10px}
.alert .acts button{border:0;border-radius:10px;padding:8px 12px;font:600 13px -apple-system,system-ui,sans-serif;background:var(--card2);color:#fff;cursor:pointer}
.alert .acts button.pri{background:var(--blue)}
.cal-day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px 4px;background:var(--card)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.sh{background:rgba(10,132,255,.15);color:var(--blue)}
.tag.p2{background:rgba(191,90,242,.18);color:var(--p2)}
.potrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid var(--sep)}
.potrow:last-child{border-bottom:0}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.status.ok{background:rgba(48,209,88,.15);color:var(--green)}
.status.watch{background:rgba(255,159,10,.15);color:var(--orange)}
.status.over{background:rgba(255,69,58,.15);color:var(--red)}
.plan-line{display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:13px 14px;border-radius:12px;margin-top:8px}
.plan-line .s{margin-top:3px}
.screen{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:380px}
.auth-box h1{font-size:36px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="view"></div>

<nav class="tabs" id="tabs"></nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)app.closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>
<div class="screen" id="auth"></div>
<div class="screen" id="loading" style="display:flex;flex-direction:column;gap:14px"><div class="spinner"></div><div class="sub">Loading FairShare…</div></div>


<script src="config.js"></script>
<script>
var BOOT_LEGACY = null; // web version: old-app history arrives through an imported code

var app = (function () {
  'use strict';

  /* ================= helpers ================= */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function today() { return startOfDay(new Date()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function ym(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function parseYmd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); }
  function mkAdd(mk, n) { var p = mk.split('-'); return ym(new Date(+p[0], +p[1] - 1 + n, 1)); }
  function mkYear(mk) { return +mk.slice(0, 4); }
  function mkMonth0(mk) { return +mk.slice(5, 7) - 1; }
  function dim(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }
  function monthName(mk, short) { return parseYmd(mk + '-01').toLocaleDateString('en-GB', short ? { month: 'short' } : { month: 'long', year: 'numeric' }); }
  function dayLabel(d) { return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
  function dayLong(d) { return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function sum(arr, f) { return arr.reduce(function (s, x) { return s + (typeof f === 'function' ? f(x) : (+x[f] || 0)); }, 0); }
  function r2(n) { return Math.round(n * 100) / 100; }
  function round5(n) { return Math.max(5, Math.round(n / 5) * 5); }
  function money(n) {
    n = r2(n || 0);
    var neg = n < 0, s = Math.abs(n).toFixed(2).split('.');
    s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '€' + s[0] + '.' + s[1];
  }
  function ord(n) { n = +n; var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function parseEuro(v) {
    if (v == null) return NaN;
    v = String(v).replace(/[\s€]/g, '');
    if (!v) return NaN;
    if (v.indexOf(',') > -1 && v.indexOf('.') > -1) v = v.replace(/\./g, '').replace(',', '.');
    else if (v.indexOf(',') > -1) v = v.replace(',', '.');
    return parseFloat(v);
  }
  function $(id) { return document.getElementById(id); }
  function val(id) { var e = $(id); return e ? e.value : ''; }
  function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }

  /* ================= Belgian holidays / paydays ================= */
  var holidayCache = {};
  function belgianHolidays(y) {
    if (holidayCache[y]) return holidayCache[y];
    var f = Math.floor, a = y % 19, b = f(y / 100), c = y % 100, d = f(b / 4), e = b % 4,
      g = f((b - f((b + 8) / 25) + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = f(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = f((a + 11 * h + 22 * l) / 451),
      em = f((h + l - 7 * m + 114) / 31), ed = ((h + l - 7 * m + 114) % 31) + 1;
    function add(n) { var x = new Date(y, em - 1, ed + n); return pad(x.getMonth() + 1) + '-' + pad(x.getDate()); }
    holidayCache[y] = ['01-01', '05-01', '07-21', '08-15', '11-01', '11-11', '12-25', add(1), add(39), add(50)];
    return holidayCache[y];
  }
  function isOffDay(d) {
    var w = d.getDay();
    if (w === 0 || w === 6) return true;
    return belgianHolidays(d.getFullYear()).indexOf(pad(d.getMonth() + 1) + '-' + pad(d.getDate())) > -1;
  }
  function payDate(y, m0, day, shift) {
    var first = new Date(y, m0, 1); y = first.getFullYear(); m0 = first.getMonth();
    var d = new Date(y, m0, Math.min(+day || 1, dim(y, m0))), moved = false;
    if (shift) { var guard = 0; while (isOffDay(d) && guard++ < 10) { d.setDate(d.getDate() - 1); moved = true; } }
    return { date: d, moved: moved };
  }
  // last working day strictly before d
  function workdayBefore(d) { var x = addDays(d, -1), g = 0; while (isOffDay(x) && g++ < 10) x = addDays(x, -1); return x; }

  /* ================= data ================= */
  var D;
  var POTS = [['food', 'Food'], ['buffer', 'Buffer'], ['fun', 'Fun']];
  function defaultPeople() {
    return [
      { id: 'p1', role: 'manager', name: 'Daniil', payMode: 'dual', day1: 25, amount1: 1050, day2: 7, amount2: 950, offset2: 1, holidayShift: true, savingsPct: 10, pots: { food: 300, fun: 200, buffer: 50 }, updatedAt: 0 },
      { id: 'p2', role: 'partner', name: 'Sabrina', payMode: 'dual', day1: 20, amount1: 240, day2: 6, amount2: 1200, offset2: 1, holidayShift: false, savingsPct: 10, pots: { food: 250, fun: 150, buffer: 30 }, updatedAt: 0 }
    ];
  }
  function defaultData() {
    return {
      version: 26, people: defaultPeople(),
      bills: [], incomes: [], transfers: [], checkins: [], snapshots: {}, dismissed: {},
      settings: { startMonth: ym(today()), openingBalance: 0, updatedAt: 0 },
      local: { me: null }
    };
  }
  function potsFromDaily(daily, foodPct) {
    var month = (+daily || 0) * 30, fp = foodPct == null ? 50 : +foodPct;
    return { food: Math.round(month * fp / 100), fun: Math.round(month * (100 - fp) / 100), buffer: 0 };
  }

  function migrateV24(old) {
    var d = defaultData();
    if (!old || !old.roommates || !old.roommates.length) return d;
    var rms = old.roommates;
    var mgr = rms.filter(function (r) { return /daniil/i.test(r.name); })[0] || rms.filter(function (r) { return r.id === 'r2'; })[0] || rms[0];
    var ptr = rms.filter(function (r) { return r !== mgr; })[0];
    var idMap = {}; idMap[mgr.id] = 'p1'; if (ptr) idMap[ptr.id] = 'p2';
    function copy(src, dst) {
      if (!src) return;
      dst.name = src.name || dst.name;
      if (src.dailyBudget != null) dst.pots = potsFromDaily(src.dailyBudget, src.foodSplitPct);
      var s = src.salaryStructure || {};
      if (s.mode) {
        dst.payMode = s.mode === 'dual' ? 'dual' : 'single';
        dst.day1 = +s.date1 || dst.day1; dst.amount1 = +s.amount1 || 0;
        dst.day2 = +s.date2 || dst.day2; dst.amount2 = +s.amount2 || 0;
        dst.offset2 = s.offset2 != null ? +s.offset2 : 1;
        dst.holidayShift = !!s.adjustForHolidays;
      }
    }
    copy(mgr, d.people[0]); copy(ptr, d.people[1]);
    d.bills = (old.bills || []).map(function (b) {
      return {
        id: b.id || uid('b'), title: b.title || 'Bill', amount: +b.amount || 0,
        frequency: +b.frequency || 1, dueMonth: +b.lastPaymentMonth || 1, day: +b.paymentDay || 1,
        shared: !b.isPersonal, owner: idMap[b.paidBy] || 'p1', updatedAt: 0
      };
    });
    d._hist = importHistory(d, old);
    d._migrated = true;
    return d;
  }

  function isLegacy(x) { return !!x && (x.legacy || String(x.id).indexOf('old_') === 0); }
  function legacyKey(x, kind) { return kind + '|' + (x.personId || x.from || '') + '|' + r2(+x.amount) + '|' + x.date; }
  // The old app on each phone kept its own copy of the history. After syncing, the same
  // payment can exist twice under different ids. Keep one, hide the rest.
  // Clean switch-over: the old app covered everything up to the end of the month it was
  // last used in, so the new app starts counting the month after. Only done once, and
  // only if nobody changed the start month by hand.
  function cutover(d) {
    if (d.cutoverDone) return;
    var legacyTr = d.transfers.filter(function (t) { return isLegacy(t) && !t.deleted; });
    if (!legacyTr.length) return;
    d.cutoverDone = Date.now();
    if ((d.settings.updatedAt || 0) > 0) return;
    var last = legacyTr.map(function (t) { return String(t.date).slice(0, 7); }).sort().pop();
    var next = mkAdd(last > ym(today()) ? ym(today()) : last, 1);
    if (next > d.settings.startMonth) d.settings.startMonth = next;
  }
  function dedupeLegacy(d) {
    var n = 0;
    [['incomes', 'i'], ['transfers', 't']].forEach(function (pair) {
      var seen = {};
      d[pair[0]].forEach(function (x) {
        if (!isLegacy(x) || x.deleted) return;
        x.legacy = true;
        var k = legacyKey(x, pair[1]);
        if (seen[k]) { x.deleted = true; x.dup = true; x.updatedAt = Date.now(); n++; } else seen[k] = 1;
      });
    });
    return n;
  }
  // Map old (v24) roommate ids to p1 (Daniil, manager) / p2 (Sabrina).
  function legacyIdMap(old) {
    var rms = old.roommates || [], map = {};
    var mgr = rms.filter(function (r) { return /daniil/i.test(r.name); })[0] || rms.filter(function (r) { return r.id === 'r2'; })[0] || rms[0];
    rms.forEach(function (r) { map[r.id] = r === mgr ? 'p1' : 'p2'; });
    return map;
  }
  // Bring over old deposit logs (as income) and old settlements (as payments from Sabrina).
  // Uses fixed ids, so running it twice never creates duplicates.
  function importHistory(d, old) {
    if (!old || !old.roommates) return { incomes: 0, transfers: 0 };
    var map = legacyIdMap(old), seen = {}, nInc = 0, nTr = 0;
    d.incomes.forEach(function (x) { seen[x.id] = 1; if (isLegacy(x) && !x.deleted) seen[legacyKey(x, 'i')] = 1; });
    d.transfers.forEach(function (x) { seen[x.id] = 1; if (isLegacy(x) && !x.deleted) seen[legacyKey(x, 't')] = 1; });
    (old.salaryLogs || []).forEach(function (l) {
      var id = 'old_i_' + l.id, pid = map[l.userId];
      if (seen[id] || !pid || !(+l.amount > 0)) return;
      var p = byId(d.people, pid), logged = new Date(+l.date || Date.now()), slot = l.part === 2 ? 'd2' : 'd1';
      // Use the scheduled payday closest to when it was logged (within 10 days) as the real date.
      var best = null;
      if (p && (p.payMode === 'single' || p.payMode === 'dual')) {
        for (var off = -1; off <= 1; off++) {
          var mk = mkAdd(ym(logged), off);

  function numOrNull(id) { var v = parseEuro(val(id)); return isNaN(v) ? null : r2(v); }
  function saveCheckin(pid) {
    var c = { id: uid('c'), personId: pid, date: ymd(today()), savings: numOrNull('ci-savings'), updatedAt: Date.now() };
    POTS.forEach(function (pt) { c[pt[0]] = numOrNull('ci-' + pt[0]); });
    if (pid === 'p1') c.main = numOrNull('ci-main');
    var any = POTS.some(function (pt) { return c[pt[0]] != null; }) || c.savings != null || c.main != null;
    if (!any) return toast('Fill in at least one amount');
    // one check-in per day per person: replace today's
    D.checkins.forEach(function (x) { if (!x.deleted && x.personId === pid && x.date === c.date) { x.deleted = true; x.updatedAt = Date.now(); } });
    D.checkins.push(c);
    save(); render(); window.scrollTo(0, 0);
    var ev = evalCheckin(c), body = '';
    ev.pots.forEach(function (r) { body += alertHtml({ lvl: r.status === 'ok' ? 'good' : r.status === 'watch' ? 'warn' : 'bad', ic: r.status === 'ok' ? '✅' : r.status === 'watch' ? '🟠' : '🔴', html: esc(potText(r, r.name)) }); });
    if (ev.savingsDrop) body += alertHtml({ lvl: 'warn', ic: '🐷', html: '<b>Savings went down ' + money(ev.savingsDrop.by) + '</b> since ' + dayLabel(parseYmd(ev.savingsDrop.since)) + '.' });
    if (pid === 'p1' && c.main != null) {
      var tb = targetBalance(), gap = c.main - tb.total;
      body += alertHtml(gap >= 0 ? { lvl: 'good', ic: '✅', html: 'Main account covers everything until ' + dayLabel(tb.nextPay) + ' (' + money(gap) + ' spare).' } : { lvl: 'bad', ic: '⚠️', html: '<b>Main account is ' + money(-gap) + ' short</b> for the bills before ' + dayLabel(tb.nextPay) + '.' });
    }

    if (pl.shortfall > 0.5) body += alertHtml({ lvl: 'bad', ic: '⚠️', html: 'This payment doesn\'t cover the bills part. ' + money(pl.shortfall) + ' short.' });
    body += '<div class="small mt">Based on ' + esc(p.name) + '\'s usual ' + money(monthlyEstimate(pid)) + '/month: this payment covers ' + pct(pl.frac) + ' of the monthly pots.</div>';
    if (pid === 'p2') body += '<button class="btn go mt" onclick="app.transferSheet(null,' + r2(pl.bills) + ')">' + (mine ? 'I sent it' : 'She sent it') + ': record ' + money(pl.bills) + '</button>';
    body += '<div class="row2 mt"><button class="btn gray" onclick="app.incomeSheet(\'' + i.id + '\')">Edit payment</button><button class="btn gray" onclick="app.closeSheet();app.dismiss(\'plan:' + i.id + '\')">Done</button></div>';
    openSheet((mine ? 'You' : p.name) + ' got ' + money(i.amount), body);
  }

  function transferSheet(id, presetAmount) {
    var t = id ? byId(D.transfers, id) : null, L = ledger();
    var from = t ? t.from : (L.owed < 0 ? 'p1' : 'p2');
    var suggested = t ? t.amount : presetAmount != null ? presetAmount : Math.abs(L.owed) > 0.005 ? Math.abs(L.owed) : '';
    var body = field('Direction', seg('tr-from', [['p2', ptr().name + ' → ' + mgr().name], ['p1', mgr().name + ' → ' + ptr().name]], from)) +
      field('Amount', moneyInput('tr-amt', suggested)) +
      (!t && L.owed > 0.005 ? '<div class="small" style="margin:-6px 4px 14px">Total still open: ' + money(L.owed) + '. Partial payments are fine.</div>' : '') +
      field('Date', '<input type="date" id="tr-date" value="' + esc(t ? t.date : ymd(today())) + '">') +
      field('Note (optional)', '<input id="tr-note" value="' + esc(t ? t.note : '') + '">') +
      '<button class="btn go" onclick="app.saveTransfer(\'' + (id || '') + '\')">' + (t ? 'Save' : 'Record payment') + '</button>' +
      (t ? '<button class="btn del mt" onclick="app.delTransfer(this,\'' + id + '\')">Delete</button>' : '');
    openSheet(t ? 'Edit payment' : 'Record payment', body);
  }
  function saveTransfer(id) {
    var amt = parseEuro(val('tr-amt')), date = val('tr-date'), from = segVal('tr-from');
    if (!(amt > 0)) return toast('Enter an amount');
    var rec = id ? byId(D.transfers, id) : null;
    if (rec) { rec.from = from; rec.amount = r2(amt); rec.date = date; rec.note = val('tr-note').trim(); rec.updatedAt = Date.now(); }
    else D.transfers.push({ id: uid('t'), from: from, amount: r2(amt), date: date || ymd(today()), note: val('tr-note').trim(), updatedAt: Date.now() });
    save(); closeSheet(); render(); toast('Payment recorded');
  }
  function delTransfer(btn, id) {
    armDelete(btn, function () { var r = byId(D.transfers, id); if (r) { r.deleted = true; r.updatedAt = Date.now(); } save(); closeSheet(); render(); toast('Deleted'); });
  }

  function billSheet(id) {
    var b = id ? byId(D.bills, id) : null, f = b ? +b.frequency || 1 : 1;
    var type = b ? (b.shared ? 'shared' : b.owner) : 'shared', monthOpts = '';
    for (var m = 1; m <= 12; m++) monthOpts += '<option value="' + m + '"' + ((b ? +b.dueMonth : today().getMonth() + 1) === m ? ' selected' : '') + '>' + monthName('2000-' + pad(m)).replace(' 2000', '') + '</option>';
    var body = field('Name', '<input id="bill-title" placeholder="e.g. Spotify, Rent" value="' + esc(b ? b.title : '') + '">') +
      field('Whose is it?', seg('bill-type', [['shared', 'Ours (shared)'], ['p1', mgr().name], ['p2', ptr().name]], type)) +
      '<div class="row2">' + field('Amount each time', moneyInput('bill-amt', b ? b.amount : '')) + '<div style="flex:0 0 90px">' + field('Day', '<input id="bill-day" inputmode="numeric" value="' + esc(b ? b.day : 1) + '">') + '</div></div>' +
      field('How often', seg('bill-freq', [['1', 'Monthly'], ['3', 'Quarterly'], ['6', '6 months'], ['12', 'Yearly']], String(f), 'billFreqChanged')) +
      '<div id="bill-month-wrap" style="' + (f === 1 ? 'display:none' : '') + '">' + field('A month it is due', '<select id="bill-month">' + monthOpts + '</select>') + '</div>' +
      '<div class="small" style="margin:-4px 4px 14px">Shared bills come out of ' + esc(mgr().name) + '\'s account. The app reminds you to have the money there the working day before.</div>' +
      '<button class="btn" onclick="app.saveBill(\'' + (id || '') + '\')">Save bill</button>' +
      (b ? '<button class="btn del mt" onclick="app.delBill(this,\'' + id + '\')">Delete</button>' : '');
    openSheet(b ? 'Edit bill' : 'New bill', body);
  }
  function billFreqChanged(v) { $('bill-month-wrap').style.display = v === '1' ? 'none' : ''; }
  function saveBill(id) {
    var title = val('bill-title').trim(), amt = parseEuro(val('bill-amt')), day = parseInt(val('bill-day'), 10);
    var f = parseInt(segVal('bill-freq'), 10) || 1, type = segVal('bill-type');
    if (!title) return toast('Give it a name');
    if (!(amt >= 0)) return toast('Enter an amount');
    if (!(day >= 1 && day <= 31)) return toast('Day must be 1–31');
    var data = { title: title, amount: r2(amt), day: day, frequency: f, dueMonth: f === 1 ? 1 : parseInt(val('bill-month'), 10) || 1, shared: type === 'shared', owner: type === 'shared' ? 'p1' : type, updatedAt: Date.now() };
    var rec = id ? byId(D.bills, id) : null;
    if (rec) Object.keys(data).forEach(function (k) { rec[k] = data[k]; });
    else { data.id = uid('b'); D.bills.push(data); }
    save(); closeSheet(); render(); toast('Bill saved');
  }
  function delBill(btn, id) {
    armDelete(btn, function () { var r = byId(D.bills, id); if (r) { r.deleted = true; r.updatedAt = Date.now(); } save(); closeSheet(); render(); toast('Deleted'); });
  }

  function personSheet(pid) {
    var p = person(pid);
    var body = field('Name', '<input id="ps-name" value="' + esc(p.name) + '">') +
      field('How pay arrives', seg('ps-mode', [['dual', 'Voorschot + rest'], ['single', 'Once a month'], ['irregular', 'Random']], p.payMode, 'personModeChanged')) +
      '<div id="ps-fixed" style="' + (p.payMode === 'irregular' ? 'display:none' : '') + '">' +
      '<div class="row2"><div style="flex:0 0 90px">' + field('Day', '<input id="ps-d1" inputmode="numeric" value="' + esc(p.day1) + '">') + '</div>' + field('<span id="ps-a1l">' + (p.payMode === 'dual' ? 'Voorschot (about)' : 'Amount (about)') + '</span>', moneyInput('ps-a1', p.amount1, '')) + '</div>' +
      '<div id="ps-dual" style="' + (p.payMode === 'dual' ? '' : 'display:none') + '">' +
      '<div class="row2"><div style="flex:0 0 90px">' + field('Day', '<input id="ps-d2" inputmode="numeric" value="' + esc(p.day2) + '">') + '</div>' + field('Rest of pay (about)', moneyInput('ps-a2', p.amount2, '')) + '</div></div>' +
      '<div class="small" style="margin:-4px 4px 14px">Just the day of the month each payment usually lands. Amounts are estimates: confirm the real amount when it arrives.</div>' +
      '<label class="toggle field"><div><div style="font-weight:500">Earlier if weekend/holiday</div><div class="small">Belgian public holidays</div></div><input type="checkbox" id="ps-hol"' + (p.holidayShift ? ' checked' : '') + '></label></div>' +
      '<div class="section" style="margin:6px 4px 10px"><h3>Saving & pots per month</h3></div>' +
      field('Savings: % of every payment', '<input id="ps-sav" inputmode="numeric" value="' + esc(p.savingsPct) + '">') +
      '<div class="row2">' + field('Food', moneyInput('ps-food', p.pots.food, '')) + field('Fun', moneyInput('ps-fun', p.pots.fun, '')) + field('Buffer', moneyInput('ps-buffer', p.pots.buffer, '')) + '</div>' +
      '<div class="small" style="margin:-4px 4px 14px">Order on payday: bills → savings → food → buffer → fun. Anything left over goes to savings too. Set Buffer to 0 to hide it.</div>' +
      '<button class="btn" onclick="app.savePerson(\'' + pid + '\')">Save</button>';
    openSheet(p.name, body);
  }
  function personModeChanged(v) {
    $('ps-fixed').style.display = v === 'irregular' ? 'none' : '';
    $('ps-dual').style.display = v === 'dual' ? '' : 'none';
    $('ps-a1l').textContent = v === 'dual' ? 'Voorschot (about)' : 'Amount (about)';
  }
  function savePerson(pid) {
    var p = person(pid), name = val('ps-name').trim();
    if (!name) return toast('Enter a name');
    p.name = name; p.payMode = segVal('ps-mode');
    p.day1 = Math.min(31, Math.max(1, parseInt(val('ps-d1'), 10) || 1));
    p.amount1 = r2(parseEuro(val('ps-a1')) || 0);
    p.day2 = Math.min(31, Math.max(1, parseInt(val('ps-d2'), 10) || 1));
    p.amount2 = r2(parseEuro(val('ps-a2')) || 0);
    p.holidayShift = !!($('ps-hol') && $('ps-hol').checked);
    p.savingsPct = Math.min(100, Math.max(0, parseInt(val('ps-sav'), 10) || 0));
    POTS.forEach(function (pt) { p.pots[pt[0]] = r2(parseEuro(val('ps-' + pt[0])) || 0); });
    p.updatedAt = Date.now();
    save(); closeSheet(); render(); toast('Saved');
  }

  function monthSheet(mk) {
    var L = ledger(), r = L.rows.filter(function (x) { return x.mk === mk; })[0];
    if (!r) { r = monthRow(mk); r.notCounted = true; }
    var sp = r.split, m = mgr(), s = ptr();
    var body = kv(esc(m.name) + ' income', money(sp.a.total)) +
      (sp.a.expectedTotal ? '<div class="small" style="margin-top:-4px">' + money(sp.a.expectedTotal) + ' still expected</div>' : '') +
      kv(esc(s.name) + ' income', money(sp.b.total)) +
      (sp.b.expectedTotal ? '<div class="small" style="margin-top:-4px">' + money(sp.b.expectedTotal) + ' still expected</div>' : '') +
      '<div class="hr"></div>' + kv('Split', pct(sp.p1) + ' / ' + pct(sp.p2)) +
      kv('Shared bills that month', money(r.shared)) + kv(esc(s.name) + '\'s part', money(r.charge), 'c-blue') +
      (r.notCounted ? '<div class="small c-orange">Not counted: this month is before the start month.</div>' : kv('Paid towards it', money(r.paid), 'c-green') + kv('Left', money(r.left))) +
      '<div class="small mt">' + esc(s.name) + '\'s part = shared bills × her share of the income that landed that month. Payments count towards the oldest month first.</div>' +
      (!r.current && isManagerView() ? '<button class="btn gray mt" onclick="app.refreshMonth(\'' + mk + '\')">Use today\'s bill amounts for this month</button>' : '') +
      '<button class="btn mt" onclick="app.openIncomeMonth(\'' + mk + '\')">See income for ' + monthName(mk, true) + '</button>';
    openSheet(monthName(mk), body);
  }
  function balanceSheet() {
    var L = ledger(), m = mgr(), s = ptr(), counted = countedTransfers();
    var fromS = counted.filter(function (t) { return t.from === 'p2'; }), fromM = counted.filter(function (t) { return t.from === 'p1'; });
    var legacy = activeTransfers().filter(isLegacy);
    var early = activeTransfers().filter(function (t) { return !isLegacy(t) && String(t.date) < D.settings.startMonth + '-01'; });
    var body = '<div class="small" style="margin-bottom:8px">Counting from 1 ' + monthName(D.settings.startMonth) + '.</div>';
    if (L.opening) body += kv('Owed before that', money(L.opening));
    L.rows.forEach(function (r) { body += kv(esc(s.name) + '\'s part of ' + monthName(r.mk, true) + ' bills (' + pct(r.split.p2) + ' of ' + money(r.shared) + ')', '+ ' + money(r.charge)); });
    if (!L.rows.length) body += '<div class="small">No months counted yet.</div>';
    body += kv('Paid by ' + esc(s.name) + ' (' + fromS.length + ')', '− ' + money(sum(fromS, 'amount')), 'c-green');
    if (fromM.length) body += kv('Paid by ' + esc(m.name) + ' to her (' + fromM.length + ')', '+ ' + money(sum(fromM, 'amount')));
    body += '<div class="hr"></div>' + kv(L.owed >= 0 ? esc(s.name) + ' owes ' + esc(m.name) : esc(m.name) + ' owes ' + esc(s.name), money(Math.abs(L.owed)));
    if (counted.length) {
      body += '<div class="section" style="margin:18px 4px 8px"><h3>Payments counted</h3></div><div class="list" style="background:var(--card2)">';
      counted.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (t) { body += transferRow(t); });
      body += '</div><div class="small">Tap a payment to fix or delete it.</div>';
    }
    if (legacy.length || early.length) {
      body += '<div class="section" style="margin:18px 4px 8px"><h3>Not counted</h3></div>' +
        kv('Old app payments (history only)', legacy.length + ' · ' + money(sum(legacy, 'amount'))) +
        (early.length ? kv('Payments before ' + monthName(D.settings.startMonth, true), early.length + ' · ' + money(sum(early, 'amount'))) : '') +
        '<div class="small">The old app counted from the 25th to the 24th, so its payments can\'t be matched to calendar months. They\'re kept for reference only. If ' + esc(s.name) + ' still owed something from the old app, enter it in Settings → Tracking.</div>';
    }
    openSheet('How this is calculated', body);
  }
  function refreshMonth(mk) { D.snapshots[mk] = makeSnapshot(mk); save(); closeSheet(); render(); toast('Updated'); }

  function whoSheet() {
    var body = '<div class="small">This decides what you see. You can change it later in Settings.</div><div class="who">' +
      '<button class="btn" onclick="app.setMe(\'p1\',true)">' + esc(mgr().name) + ' (manages the money)</button>' +
      '<button class="btn" style="background:var(--p2)" onclick="app.setMe(\'p2\',true)">' + esc(ptr().name) + '</button></div>';
    openSheet('Whose phone is this?', body);
  }
  function setMe(id, fromSheet) {
    D.local.me = id; lsSet(ME_KEY, id); checkinFor = null;
    if (fromSheet) { closeSheet(); if (D._migrated) toast('Imported bills, pay dates' + (D._hist ? ', ' + D._hist.incomes + ' deposits and ' + D._hist.transfers + ' payments' : '') + ' from the old app'); }
    render();
  }

  function saveTracking() {
    var sm = val('set-start'), ob = parseEuro(val('set-open'));
    if (!/^\d{4}-\d{2}$/.test(sm)) return toast('Pick a month');
    D.settings.startMonth = sm; D.settings.openingBalance = isNaN(ob) ? 0 : r2(ob); D.settings.updatedAt = Date.now();
    save(); render(); toast('Saved');
  }
  function reimportHistory() {
    var lg = null;
    try { lg = JSON.parse(BOOT_LEGACY); } catch (e) { lg = null; }
    if (!lg) return toast('Could not read the old app file');
    var r = importHistory(D, lg);
    save(); render(); toast(r.incomes || r.transfers ? 'Added ' + r.incomes + ' deposits and ' + r.transfers + ' payments' : 'Nothing new to import');
  }
  function copySync() { copyText(exportCode(), 'Backup code copied. Keep it somewhere safe.'); }
  function pasteSync() {
    try { if (navigator.clipboard && navigator.clipboard.readText) { navigator.clipboard.readText().then(onPaste).catch(function () { toast('Tap in the box and paste instead'); }); return; } } catch (e) {}
    toast('Tap in the box and paste instead');
  }
  function onPaste(t) { var e = $('sync-in'); if (e && t) e.value = t; }
  function importSync(replace) {
    var text = val('sync-in');
    if (!text.trim()) return toast('Paste a code first');
    var res;
    try { res = decodeCode(text); } catch (e) { return toast('That code could not be read'); }
    if (replace && !confirmTwice('btn-replace', 'Tap again: this replaces the data on BOTH phones')) return;
    var incoming = res.v === 1 ? migrateV24(res.data) : res.data, me = D.local.me;
    if (replace) { D = normalize(incoming); dedupeLegacy(D); cutover(D); D.local = { me: me }; delete D._migrated; cloud.replace = true; }
    else mergeData(incoming);
    save(); render(); toast(replace ? 'Replaced. Syncing to both phones…' : 'Merged');
  }
  function copySummary() {
    var L = ledger(), m = mgr(), s = ptr(), out = [], tb = targetBalance();
    out.push('FairShare, ' + today().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }));
    out.push(L.owed > 0.005 ? s.name + ' owes ' + m.name + ': ' + money(L.owed) : L.owed < -0.005 ? m.name + ' owes ' + s.name + ': ' + money(-L.owed) : 'All square');
    out.push('');
    out.push('Coming up:');
    calendar(35).forEach(function (e) {
      if (e.type === 'bill' && e.b.shared) out.push('  ' + dayLabel(e.date) + '  ' + e.b.title + ' ' + money(e.b.amount));
      if (e.type === 'pay' && e.s.pid === 'p2') out.push('  ' + dayLabel(e.date) + '  ' + s.name + ' paid (' + e.s.label + '), sends ≈ ' + money(paydayPlan('p2', e.s.amount, ymd(e.date)).bills));
    });
    out.push('');
    L.rows.slice().reverse().slice(0, 4).forEach(function (r) {
      out.push(monthName(r.mk) + (r.current ? ' (so far)' : ''));
      out.push('  Income: ' + m.name + ' ' + money(r.split.a.total) + ', ' + s.name + ' ' + money(r.split.b.total) + ' (' + pct(r.split.p1) + ' / ' + pct(r.split.p2) + ')');
      out.push('  Shared bills ' + money(r.shared) + ' x ' + pct(r.split.p2) + ' = ' + money(r.charge) + '. Paid ' + money(r.paid) + ', left ' + money(r.left));
    });
    copyText(out.join('\n'), 'Summary copied');
  }

  /* ================= boot ================= */
  function init() {
    D = load();
    render();
    document.addEventListener('focusout', function () { setTimeout(function () { if (pendingRender && !($('view').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) { pendingRender = false; render(); } }, 50); });
  }

  var api = {
    init: init, go: go, cloudReady: cloudReady, cloudFailed: cloudFailed, showLogin: showLogin, authGo: authGo, authReset: authReset, signOut: signOut,
    forceSignOut: function () { lsSet(CACHE_KEY, null); cloud.fb.signOut().then(function () { location.reload(); }); },
    _cloud: function () { return cloud; }, closeSheet: closeSheet, segPick: segPick, dismiss: dismiss, applyRaise: applyRaise,
    incomeSheet: incomeSheet, saveIncome: saveIncome, delIncome: delIncome, confirmExpected: confirmExpected, planSheet: planSheet,
    transferSheet: transferSheet, saveTransfer: saveTransfer, delTransfer: delTransfer,
    billSheet: billSheet, billFreqChanged: billFreqChanged, saveBill: saveBill, delBill: delBill,
    personSheet: personSheet, personModeChanged: personModeChanged, savePerson: savePerson,
    monthSheet: monthSheet, balanceSheet: balanceSheet, refreshMonth: refreshMonth, setMe: setMe,
    saveCheckin: saveCheckin, delCheckinSheet: delCheckinSheet, delCheckin: delCheckin,
    checkinWho: function (v) { checkinFor = v; render(); },
    saveTracking: saveTracking, reimportHistory: reimportHistory, copySync: copySync, pasteSync: pasteSync, onPaste: onPaste, importSync: importSync, copySummary: copySummary,
    incMonth: function (n) { var mk = mkAdd(incomeMk || currentMk(), n); if (mk > currentMk()) return; incomeMk = mk; render(); },
    openIncomeMonth: function (mk) { incomeMk = mk; go('income'); },
    _data: function () { return D; }, _ledger: ledger, _split: split, _plan: paydayPlan, _target: targetBalance,
    _calendar: calendar, _advice: advice, _exportCode: exportCode
  };
  return api;
})();
app.init();
</script>
<script type="module">
  // Firebase (login + live database). Version from firebase.google.com/docs/web/alt-setup
  const V = '12.19.0';
  const cfg = window.FAIRSHARE_CONFIG || {};
  const fbc = cfg.firebase || {};
  if (!fbc.apiKey || /PASTE/.test(fbc.apiKey)) {
    app.cloudFailed('config.js is not filled in yet. Paste your Firebase settings into config.js (see the setup guide).');
  } else {
    try {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/' + V + '/firebase-app.js');
      const A = await import('https://www.gstatic.com/firebasejs/' + V + '/firebase-auth.js');
      const F = await import('https://www.gstatic.com/firebasejs/' + V + '/firebase-firestore.js');
      const fbApp = initializeApp(fbc);
      const auth = A.getAuth(fbApp);
      try { await A.setPersistence(auth, A.browserLocalPersistence); } catch (e) {}
      const db = F.getFirestore(fbApp);
      const ref = F.doc(db, 'households', cfg.householdId || 'home');
      app.cloudReady({
        onAuth: (cb) => A.onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, email: u.email } : null)),
        signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
        signUp: (e, p) => A.createUserWithEmailAndPassword(auth, e, p),
        reset: (e) => A.sendPasswordResetEmail(auth, e),
        signOut: () => A.signOut(auth),
        watch: (cb, onErr) => F.onSnapshot(ref, (snap) => cb(snap.exists() ? snap.data().data : null), onErr),
        transact: (fn) => F.runTransaction(F.getFirestore(fbApp), async (tx) => {
          const snap = await tx.get(ref);
          const text = fn(snap.exists() ? snap.data().data : null);
          tx.set(ref, { data: text, updatedAt: F.serverTimestamp(), by: (auth.currentUser && auth.currentUser.email) || '' });
        })
      });
    } catch (e) {
      app.cloudFailed('Could not load Firebase. Check your internet connection and try again. (' + (e && e.message) + ')');
    }
  }
</script>
</body>
