<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FairShare</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FairShare">
<meta name="theme-color" content="#000000">
<meta name="fairshare-version" content="2026-10-09c">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--sep:#38383a;--text:#fff;--muted:#a1a1a6;--muted2:#636366;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--p1:#0a84ff;--p2:#bf5af2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding:max(env(safe-area-inset-top),16px) 0 calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font-family:inherit}
::-webkit-scrollbar{display:none}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 2px 18px}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:0}
.sub{color:var(--muted);font-size:14px}
.small{font-size:14px;color:var(--muted);line-height:1.45}
.small b,.w{color:#fff;font-weight:600}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px}
.label{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.mid{font-size:22px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 10px;font:600 16px -apple-system,system-ui,sans-serif;color:#fff;background:var(--blue);cursor:pointer;text-align:center}
.btn:active,.link:active,.tap:active,.copy:active,.tick:active,.chip:active{opacity:.6}
.btn:disabled{opacity:.4}
.btn.gray{background:var(--card2)}
.card .btn.gray,.banner .btn.gray{background:var(--card3)}
.btn.go{background:var(--green);color:#000}
.btn.del{background:var(--card2);color:var(--red)}
.btn.del.armed{background:var(--red);color:#fff}
.btn.sm{padding:10px 8px;font-size:14px;border-radius:12px}
.btns{display:flex;gap:10px}.btns>*{flex:1;min-width:0}
.mt{margin-top:14px}.mt-s{margin-top:8px}
.list{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.item:last-child{border-bottom:0}
.item.sel{background:rgba(10,132,255,.14)}
.grow{flex:1;min-width:0}
.t{font-weight:500;overflow-wrap:anywhere}
.s{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.amt{font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--muted2);font-size:20px;line-height:1}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.section{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 8px;gap:10px}
.section h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--blue);font:500 15px -apple-system,system-ui,sans-serif;padding:4px;cursor:pointer;white-space:nowrap}
.link.sm{font-size:14px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--card2);margin:4px 0 12px;gap:2px}
.bar div{height:100%}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;font-size:16px}
.kv>span:first-child{color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hr{height:.5px;background:var(--sep);margin:8px 0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:rgba(48,209,88,.15);color:var(--green)}
.pill.due{background:rgba(255,159,10,.15);color:var(--orange)}
.pill.bad{background:rgba(255,69,58,.15);color:var(--red)}
.pill.exp{background:rgba(142,142,147,.18);color:var(--muted)}
.c-green{color:var(--green)}.c-red{color:var(--red)}.c-orange{color:var(--orange)}.c-muted{color:var(--muted)}.c-blue{color:var(--blue)}.c-p2{color:var(--p2)}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.avatar.sm{width:24px;height:24px;font-size:11px}
.mnav{display:flex;gap:6px}
.mnav button{background:var(--card);border:0;color:var(--blue);width:32px;height:32px;border-radius:16px;font-size:17px;cursor:pointer}
.mnav button:disabled{opacity:.3}
/* hero */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flow{display:flex;align-items:center;gap:4px;min-width:0}
.flow .arr{color:var(--muted);font-size:13px}
.hero-lbl{font-size:15px;color:var(--muted);margin-top:14px}
.nx{display:flex;align-items:center;gap:12px;padding:7px 0}
.nx-d{width:42px;height:42px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.nx-day{font-size:17px;font-weight:700}
.nx-mon{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-top:3px}
.state{display:flex;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px;background:var(--card2)}
.state.ok{background:rgba(48,209,88,.12);color:var(--green)}
.state.warn{background:rgba(255,159,10,.12);color:var(--orange)}
.state.bad{background:rgba(255,69,58,.12);color:var(--red)}
.cols{display:flex;gap:12px}.cols>div{flex:1;min-width:0}
/* division */
.dv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dv-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:16px 0 2px;background:var(--card2)}
.dv-bar i{display:block;height:100%;min-width:3px}
.step{display:flex;align-items:center;gap:10px;margin:20px 0 2px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--card3);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:0;flex:none}
.step .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.dv-line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.dv-line:last-child,.dv-line.last{border-bottom:0}
.dv-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.dv-line.done .t{text-decoration:line-through;opacity:.5}
.dv-line.done .copy{opacity:.5}
.copy{background:none;border:0;color:#fff;font:600 16px/1.2 -apple-system,system-ui,sans-serif;padding:6px 0 6px 4px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted2);background:none;flex:none;color:transparent;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tick.on{background:var(--green);border-color:var(--green);color:#000}
.send{background:rgba(10,132,255,.1);border-radius:14px;padding:4px 12px 12px;margin-top:8px}
.send .dv-line{border:0}
.banner{background:var(--card2);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px;line-height:1.4}
.banner.warn{background:rgba(255,159,10,.12)}
.banner .btns{margin-top:10px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;background:rgba(28,28,30,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:7px 4px max(env(safe-area-inset-bottom),8px)}
.tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px -apple-system,system-ui,sans-serif;flex:1;max-width:72px;min-width:0;padding:0;cursor:pointer;position:relative}
.tabs button.on{color:var(--blue)}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .badge{position:absolute;top:-2px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid #1c1c1e}
/* history */
.why{font-size:14.5px;color:var(--muted);line-height:1.45;margin-top:6px}
.why b{color:#fff;font-weight:600}
.why-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;line-height:1.35}
.why-row>span:first-child{min-width:0}
.why-row>span:last-child{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.h-st{font-size:13.5px;margin-top:3px;font-weight:500}
.dv-sub{font-size:13.5px;color:var(--muted);margin:10px 0 0 50px}
.dv-line.pocket{padding-left:16px}
.dv-line.pocket .dv-ic{width:32px;height:32px;font-size:15px;border-radius:10px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.16,1,.3,1);-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.sheet-head h2{margin:0;font-size:21px;letter-spacing:-.3px}
.x{background:var(--card2);color:var(--muted);border:0;width:32px;height:32px;border-radius:16px;font-size:18px;cursor:pointer;flex:none}
.sheet .list{background:var(--card2)}
.sheet .item{border-bottom-color:var(--card3)}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px 4px}
input,select,textarea{width:100%;background:var(--card2);color:#fff;border:0;border-radius:12px;padding:14px;font:17px -apple-system,system-ui,sans-serif;color-scheme:dark;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px var(--blue)}
.card input,.card select,.card textarea{background:var(--card2)}
input.money{font-size:26px;font-weight:700}
textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:#fff;padding:10px 4px;border-radius:9px;font:500 14px -apple-system,system-ui,sans-serif;cursor:pointer;min-width:0}
.seg button.on{background:#636366}
.seg.mini button{padding:8px 2px;font-size:13px}
.sheet .seg{background:var(--card2)}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:12px;padding:12px 14px;gap:12px}
.toggle input{width:22px;height:22px;-webkit-appearance:auto;appearance:auto;accent-color:var(--blue);flex:none;padding:0;box-shadow:none}
.toast{position:fixed;left:50%;top:max(env(safe-area-inset-top),14px);transform:translateX(-50%);background:#3a3a3c;color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;font-weight:500;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.show{opacity:1}
.toast.act{pointer-events:auto}
.toast button{background:none;border:0;color:var(--blue);font:600 14px -apple-system,system-ui,sans-serif;padding:2px;cursor:pointer}
.who{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--blue)}
.alert.warn{border-left-color:var(--orange)}.alert.news{border:1px solid rgba(10,132,255,.45);border-left:4px solid var(--blue)}.alert.bad{border-left-color:var(--red)}.alert.good{border-left-color:var(--green)}
.sheet .alert{background:var(--card2)}
.alert .ic{font-size:18px;line-height:1.2;flex:none}
.alert .msg{flex:1;font-size:15px;line-height:1.4;min-width:0}
.alert .msg b{font-weight:600}
.alert .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.alert .acts button{border:0;border-radius:10px;padding:8px 12px;font:600 13px -apple-system,system-ui,sans-serif;background:var(--card2);color:#fff;cursor:pointer}
.alert .acts button.pri{background:var(--blue)}
.alert .acts button.go{background:var(--green);color:#000}
.cal-day{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px 4px;display:flex;justify-content:space-between}
.cal-day span{text-transform:none;letter-spacing:0;font-weight:500}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.sh{background:rgba(10,132,255,.15);color:var(--blue)}
.potrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:.5px solid var(--sep)}
.potrow:last-child{border-bottom:0}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.status.ok{background:rgba(48,209,88,.15);color:var(--green)}
.status.watch{background:rgba(255,159,10,.15);color:var(--orange)}
.status.over{background:rgba(255,69,58,.15);color:var(--red)}
/* split editor */
.pk{background:var(--card2);border-radius:14px;padding:10px;margin-bottom:10px;border-left:4px solid var(--muted)}
.pk.auto{opacity:.85;display:flex;align-items:center;gap:10px}
.pk-top,.pk-bot{display:flex;gap:8px;align-items:center}
.pk-bot{margin-top:8px}
.pk input{background:var(--card3);padding:10px;font-size:16px;border-radius:10px}
.pk .pk-ic{width:46px;flex:none;text-align:center;padding:10px 2px}
.pk-name{flex:1;min-width:0}
.pk-btn{width:34px;height:40px;border:0;border-radius:10px;background:var(--card3);color:#fff;font-size:15px;flex:none;cursor:pointer;padding:0}
.pk-btn:disabled{opacity:.25}
.pk-btn.del{color:var(--red)}
.pk-val{display:flex;align-items:center;background:var(--card3);border-radius:10px;flex:0 0 104px}
.pk .pk-val input{background:none;width:100%;min-width:0;padding:10px 4px 10px 10px}
.pk-val span{color:var(--muted);font-size:13px;padding-right:10px;white-space:nowrap}
.pk .seg{flex:1;background:var(--card3)}
.pk .seg button.on{background:#5a5a5e}
.chip{border:0;border-radius:20px;padding:8px 10px;font:600 12px -apple-system,system-ui,sans-serif;background:var(--card3);color:var(--muted);flex:none;cursor:pointer}
.chip.on{background:rgba(48,209,88,.18);color:var(--green)}
.sw{width:16px;height:16px;border-radius:50%;border:0;flex:none;cursor:pointer;padding:0}
details{background:var(--card);border-radius:18px;margin-bottom:14px}
details summary{padding:16px 18px;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'›';color:var(--muted2);font-size:20px;line-height:1;transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
details .inner{padding:0 18px 18px}
.screen{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.auth-box{width:100%;max-width:380px}
.auth-box h1{font-size:36px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="view"></div>

<nav class="tabs" id="tabs"></nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)app.closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>
<div class="screen" id="auth"></div>
<div class="screen" id="loading" style="display:flex;flex-direction:column;gap:14px"><div class="spinner"></div><div class="sub">Loading FairShare…</div></div>


<script src="config.js"></script>
<script>
var app = (function () {
  'use strict';

  /* ================= helpers ================= */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function today() { return startOfDay(new Date()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function ym(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function parseYmd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); }
  function mkAdd(mk, n) { var p = mk.split('-'); return ym(new Date(+p[0], +p[1] - 1 + n, 1)); }
  function mkYear(mk) { return +mk.slice(0, 4); }
  function mkMonth0(mk) { return +mk.slice(5, 7) - 1; }
  function dim(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }
  function lastDayOf(mk) { return new Date(mkYear(mk), mkMonth0(mk) + 1, 0); }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }
  function monthName(mk, short) { return parseYmd(mk + '-01').toLocaleDateString('en-GB', short ? { month: 'short' } : { month: 'long', year: 'numeric' }); }
  function monthOnly(mk) { return parseYmd(mk + '-01').toLocaleDateString('en-GB', { month: 'long' }); }
  function dayLabel(d) { return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
  function dayLong(d) { return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function relDay(d) {
    var n = daysBetween(today(), d);
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    if (n === -1) return 'yesterday';
    return n > 0 ? 'in ' + n + ' days' : -n + ' days ago';
  }
  function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function sum(arr, f) { return arr.reduce(function (s, x) { return s + (typeof f === 'function' ? f(x) : f ? (+x[f] || 0) : (+x || 0)); }, 0); }
  function r2(n) { return Math.round((+n || 0) * 100) / 100; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function round5(n) { return Math.max(5, Math.round(n / 5) * 5); }
  function money(n) {
    n = r2(n || 0);
    var neg = n < 0, s = Math.abs(n).toFixed(2).split('.');
    s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '€' + s[0] + '.' + s[1];
  }
  function money0(n) { var s = money(n); return s.slice(-3) === '.00' ? s.slice(0, -3) : s; }
  function ord(n) { n = +n; var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function pct1(x) { return (Math.round(x * 1000) / 10) + '%'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

  function fillSlotOptions() {
    var sel = $('inc-slot'); if (!sel || !incForm) return;
    var pid = segVal('inc-who') || incForm.pid, dv = val('inc-date'), d = dv ? parseYmd(dv) : today(), mk = ym(d), opts = [];
    [-1, 0, 1].forEach(function (o) {
      var m = mkAdd(mk, o);
      schedule(person(pid), m).forEach(function (s) {
        var taken = slotTakenBy(pid, m, s.slot);
        if (taken && taken !== incForm.id) return;
        opts.push({ v: m + '|' + s.slot, label: s.label + ' · ' + dayLabel(s.date), diff: Math.abs(daysBetween(s.date, d)) });
      });
    });
    var cur = incForm.slotSel;
    if (cur == null || (cur !== '' && !opts.some(function (o) { return o.v === cur; }))) {
      var best = opts.filter(function (o) { return o.diff <= 10; }).sort(function (a, b) { return a.diff - b.diff; })[0];
      cur = best ? best.v : '';
    }
    sel.innerHTML = opts.map(function (o) { return '<option value="' + o.v + '"' + (o.v === cur ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') +

      try { await A.setPersistence(auth, A.browserLocalPersistence); } catch (e) {}
      const db = F.getFirestore(fbApp);
      const ref = F.doc(db, 'households', cfg.householdId || 'home');
      app.cloudReady({
        onAuth: (cb) => A.onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, email: u.email } : null)),
        signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
        signUp: (e, p) => A.createUserWithEmailAndPassword(auth, e, p),
        reset: (e) => A.sendPasswordResetEmail(auth, e),
        signOut: () => A.signOut(auth),
        watch: (cb, onErr) => F.onSnapshot(ref, (snap) => cb(snap.exists() ? snap.data().data : null), onErr),
        transact: (fn) => F.runTransaction(db, async (tx) => {
          const snap = await tx.get(ref);
          const text = fn(snap.exists() ? snap.data().data : null);
          tx.set(ref, { data: text, updatedAt: F.serverTimestamp(), by: (auth.currentUser && auth.currentUser.email) || '' });
        })
      });
    } catch (e) {
      app.cloudFailed('Could not load Firebase. Check your internet connection and try again. (' + (e && e.message) + ')');
    }
  }
</script>
